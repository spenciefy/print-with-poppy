name: Cloudflare
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected isolated Cloudflare environment
        type: boolean
        default: false
      target:
        description: Cloudflare environment
        type: choice
        options: [sandbox, production]
        default: sandbox
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:cloudflare
      - run: npm run test:cloudflare:production
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: runtime
    environment: cloudflare-${{ github.event_name == 'push' && 'production' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the selected GitHub Cloudflare environment."
            exit 1
          fi
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --env "$CF_TARGET"
        env:
          CF_TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify deployed service
        env:
          CF_TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const production = process.env.CF_TARGET === 'production';
          const origin = production
            ? 'https://printwithpoppy.com'
            : 'https://sandbox.printwithpoppy.com';
          async function verify() {
            for (const path of ['/api/health', '/.well-known/poppy.json']) {
              const response = await fetch(origin + path, { signal: AbortSignal.timeout(10_000), cache: "no-store" });
              assert(response.ok, `${path}: HTTP ${response.status}`);
              if (path.endsWith('poppy.json')) {
                const manifest = await response.json();
                assert.equal(manifest.protocol_version, '0.4');
                assert.equal(manifest.extensions?.operations?.[0]?.version, '3');
              }
            }
            const description = await fetch(origin + '/openapi.json', { signal: AbortSignal.timeout(10_000), cache: 'no-store' });
            assert(description.ok, `OpenAPI: HTTP ${description.status}`);
            const text = await description.text();
            assert(text.includes('poppy_dlg') && text.includes('poppy-delegation+jwt'), 'Published Session proof contract is stale');
            const response = await fetch(origin + '/api/config', { signal: AbortSignal.timeout(10_000), cache: 'no-store' });
            assert(response.ok, `config: HTTP ${response.status}`);
            const config = await response.json();
            assert.equal(config.mode, production ? 'live' : 'demo');
            if (production) assert.equal(config.restrictedLaunch, false);
          }
          // Durable Object updates can be deferred for 300s. Wait for observed readiness.
          const deadline = Date.now() + 7 * 60_000;
          for (;;) {
            try { await verify(); break; }
            catch (error) {
              if (Date.now() >= deadline) throw error;
              console.log(`Waiting for deployment: ${error.message}`);
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
          }
          console.log(`Verified ${origin}: health, discovery, mode and launch configuration. This is not a paid-order end-to-end test.`);
          JS
